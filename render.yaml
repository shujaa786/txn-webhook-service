# Render Blueprint: New + > Blueprint > pick this repo. Creates the web service and the Postgres DB.
databases:
  - name: txn-db
    plan: free
services:
  - type: web
    name: txn-webhook-service
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: txn-db, property: connectionString }
